<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Media</title>
  <link rel="stylesheet" href="/tv/css/style.css">
  <script src="/tv/js/app.js" defer></script>
</head>
<body>
  <main>
    <header><p class="brand">MY MEDIA</p><p>Your home cinema</p></header>
    <section aria-labelledby="welcome-title">
      <h1 id="welcome-title">Welcome home.</h1>
      <p>Your movie library will appear here once it is connected.</p>
      <p id="server-status" role="status" aria-live="polite">Checking media server…</p>
      <button id="check-server" type="button">Check connection</button>
      <noscript><p>Enable JavaScript to check the media server connection.</p></noscript>
    </section>
  </main>
</body>
</html>
