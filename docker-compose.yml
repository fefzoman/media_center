services:
  torrserver:
    build:
      context: ./infra/torrserver
      args:
        TORRSERVER_VERSION: ${TORRSERVER_VERSION:-MatriX.142.LT-1.1.8}
    ports:
      - "${TORRENT_PEER_PORT:-32000}:32000/tcp"
      - "${TORRENT_PEER_PORT:-32000}:32000/udp"
    volumes:
      - torrserver-config:/opt/ts/config
    healthcheck:
      test:
        - CMD
        - /usr/bin/curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8090/echo
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 15s

  torrserver-init:
    build: ./backend
    command: ["python", "-m", "media_center.torrents.configure"]
    environment: &backend-environment
      MEDIA_CENTER_HOST: ${MEDIA_CENTER_HOST:-0.0.0.0}
      MEDIA_CENTER_PORT: ${MEDIA_CENTER_PORT:-8000}
      TORRSERVER_BASE_URL: ${TORRSERVER_BASE_URL:-http://torrserver:8090}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/media-center.db}
      TV_BASE_URL: ${TV_BASE_URL:-http://192.168.1.50}
      DEFAULT_CLIENT_ID: ${DEFAULT_CLIENT_ID:-lg-living-room}
      TORRENT_CACHE_MB: ${TORRENT_CACHE_MB:-1024}
      TORRENT_USE_DISK: ${TORRENT_USE_DISK:-false}
      TORRSERVER_REQUEST_TIMEOUT_SECONDS: ${TORRSERVER_REQUEST_TIMEOUT_SECONDS:-10}
      TORRSERVER_METADATA_TIMEOUT_SECONDS: ${TORRSERVER_METADATA_TIMEOUT_SECONDS:-120}
      TORRSERVER_POLL_INTERVAL_SECONDS: ${TORRSERVER_POLL_INTERVAL_SECONDS:-1}
      ENABLE_DEBUG_ENDPOINT: ${ENABLE_DEBUG_ENDPOINT:-true}
    depends_on:
      torrserver:
        condition: service_healthy

  backend:
    build: ./backend
    environment: *backend-environment
    volumes:
      - media-data:/data
    depends_on:
      torrserver-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['MEDIA_CENTER_PORT'] + '/api/v1/health', timeout=3).close()"
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 10s

  nginx:
    image: nginx:1.30.5-alpine
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
    environment:
      MEDIA_CENTER_PORT: ${MEDIA_CENTER_PORT:-8000}
      NGINX_ENVSUBST_FILTER: ^MEDIA_CENTER_PORT$$
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./frontend:/usr/share/nginx/html/tv:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  media-data:
  torrserver-config:
