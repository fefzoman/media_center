# Rendered by the official nginx image; only MEDIA_CENTER_PORT is substituted.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /tv/;
    }

    location = /tv {
        return 301 /tv/;
    }

    location /tv/ {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://backend:${MEDIA_CENTER_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Playback routing is intentionally reserved until the adapter exists.
    location /play/ {
        return 501;
    }

    location / {
        return 404;
    }
}
